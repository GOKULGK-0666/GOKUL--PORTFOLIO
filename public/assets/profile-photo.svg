<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" role="img" aria-labelledby="title desc">
  <title id="title">Profile photo placeholder</title>
  <desc id="desc">Replace this file with your own profile photo named profile-photo.jpg.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b6b8ac"/>
      <stop offset="1" stop-color="#74786f"/>
    </linearGradient>
  </defs>
  <rect width="600" height="760" fill="url(#bg)"/>
  <circle cx="300" cy="270" r="120" fill="#d8d7cf" opacity=".8"/>
